# 로컬 개발용 인프라.
#
# 모든 포트를 127.0.0.1에 묶는다. 호스트 IP를 생략하면 Docker가 모든 인터페이스에 게시해,
# 공유 네트워크(사내망·카페 Wi-Fi)에서 같은 망의 누구나 예측 가능한 계정으로 DB에 붙을 수 있다.
#
# 자격증명은 .env로 주입한다. 값을 필수로 강제하지는 않는다 — `docker compose up -d` 한 줄로
# 로컬 인프라가 뜨는 것이 온보딩 전제이고, 이 컨테이너들은 loopback에만 열려 있다.
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: kurly-rabbitmq
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kurly-redis
    hostname: redis
    ports:
      - "127.0.0.1:6379:6379"
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 서비스별 DB
  auth-mysql:
    image: mysql:8.4
    container_name: kurly-auth-mysql
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: auth_db
      MYSQL_USER: ${DB_USERNAME:-kurly}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kurly}
    volumes:
      - auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  payment-mysql:
    image: mysql:8.4
    container_name: kurly-payment-mysql
    ports:
      - "127.0.0.1:3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: payment_db
      MYSQL_USER: ${DB_USERNAME:-kurly}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kurly}
    volumes:
      - payment_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  user-mysql:
    image: mysql:8.4
    container_name: kurly-user-mysql
    ports:
      - "127.0.0.1:3314:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: user_db
      MYSQL_USER: ${DB_USERNAME:-kurly}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kurly}
    volumes:
      - user_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  scm-postgres:
    image: postgres:16-alpine
    container_name: kurly-scm-postgres
    ports:
      - "127.0.0.1:5439:5432"
    environment:
      POSTGRES_DB: scm_db
      POSTGRES_USER: ${DB_USERNAME:-kurly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kurly}
    volumes:
      - scm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kurly} -d scm_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: kurly-swagger-ui
    ports:
      - "8080:8080"
    environment:
      URLS: "[
        { url: 'http://127.0.0.1:8081/v3/api-docs', name: '1. Auth Service' },
        { url: 'http://127.0.0.1:8082/v3/api-docs', name: '2. Order Service' },
        { url: 'http://127.0.0.1:8083/v3/api-docs', name: '3. Payment Service' },
        { url: 'http://127.0.0.1:8084/v3/api-docs', name: '4. Product Service' },
        { url: 'http://127.0.0.1:8085/v3/api-docs', name: '5. WMS Service' },
        { url: 'http://127.0.0.1:8086/v3/api-docs', name: '6. OMS Service' },
        { url: 'http://127.0.0.1:8087/v3/api-docs', name: '7. SCM Service' },
        { url: 'http://127.0.0.1:8088/v3/api-docs', name: '8. User Service' }
      ]"
      CONFIG_URL_FILTER_TYPE: "combo"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  rabbitmq_data:
    name: kurly-rabbitmq-data
  redis_data:
    name: kurly-redis-data
  auth_mysql_data:
    name: kurly-auth-mysql-data
  payment_mysql_data:
    name: kurly-payment-mysql-data
  user_mysql_data:
    name: kurly-user-mysql-data
  scm_postgres_data:
    name: kurly-scm-postgres-data
