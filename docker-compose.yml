services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: kurly-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kurly-redis
    hostname: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 서비스별 DB
  auth-mysql:
    image: mysql:8.4
    container_name: kurly-auth-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: auth_db
      MYSQL_USER: ${DB_USERNAME:-kurly}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kurly}
    volumes:
      - auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  payment-mysql:
    image: mysql:8.4
    container_name: kurly-payment-mysql
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: payment_db
      MYSQL_USER: ${DB_USERNAME:-kurly}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kurly}
    volumes:
      - payment_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  user-mysql:
    image: mysql:8.4
    container_name: kurly-user-mysql
    ports:
      - "3314:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: user_db
      MYSQL_USER: ${DB_USERNAME:-kurly}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kurly}
    volumes:
      - user_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  scm-postgres:
    image: postgres:16-alpine
    container_name: kurly-scm-postgres
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB: scm_db
      POSTGRES_USER: ${DB_USERNAME:-kurly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kurly}
    volumes:
      - scm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kurly} -d scm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: kurly-swagger-ui
    ports:
      - "8080:8080"
    environment:
      URLS: "[
        { url: 'http://localhost:8081/v3/api-docs', name: '1. Auth Service' },
        { url: 'http://localhost:8082/v3/api-docs', name: '2. Order Service' },
        { url: 'http://localhost:8083/v3/api-docs', name: '3. Payment Service' },
        { url: 'http://localhost:8084/v3/api-docs', name: '4. Product Service' },
        { url: 'http://localhost:8085/v3/api-docs', name: '5. WMS Service' },
        { url: 'http://localhost:8086/v3/api-docs', name: '6. OMS Service' },
        { url: 'http://localhost:8087/v3/api-docs', name: '7. SCM Service' }
      ]"
      CONFIG_URL_FILTER_TYPE: "combo"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  rabbitmq_data:
    name: kurly-rabbitmq-data
  redis_data:
    name: kurly-redis-data
  auth_mysql_data:
    name: kurly-auth-mysql-data
  payment_mysql_data:
    name: kurly-payment-mysql-data
  user_mysql_data:
    name: kurly-user-mysql-data
  scm_postgres_data:
    name: kurly-scm-postgres-data
