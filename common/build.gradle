plugins {
    id 'java-library'
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-amqp'
    api 'org.springframework.boot:spring-boot-starter-data-redis'

    // 공통 인증 처리기의 JWT 검증·JWKS 조회에 사용한다.
    // Spring Boot BOM이 관리하지 않아 버전을 직접 지정한다.
    api 'com.nimbusds:nimbus-jose-jwt:10.9.1'

    // 세션 활동 이벤트의 파드 로컬 디바운스. Spring Boot BOM이 버전을 관리한다.
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Swagger
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 커버리지 임계값. 리포트 생성은 루트에서 전 모듈에 적용되고, 검증만 여기서 건다.
//
// 다른 서비스는 80%인데 여기는 낮다. 전 서비스가 의존하는 모듈이라 기준을 높게 두는 것이
// 맞지만, 지금 올려 버리면 빌드가 곧바로 깨져 아무도 통과시킬 수 없다. 그래서 현재 수준
// 바로 아래에 걸어 두고 후퇴만 막는다. 테스트를 채우며 단계적으로 80%까지 올린다.
//
// 미달의 대부분은 NimbusJwtVerifier·HandlerAuthorizationAuditor·GlobalExceptionHandler다.
// 설정이 아니라 실제 로직이므로 제외가 아니라 테스트로 메워야 한다.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.65
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.75
            }
        }
    }
    // 측정 대상에서 제외: 빈 배선·문서 설정처럼 로직이 없는 것과 상수·열거형.
    // 다른 서비스가 infrastructure/config/** 를 빼는 것과 같은 기준이다.
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/config/**',
                    '**/swagger/**',
                    '**/security/Role.class',
                    '**/security/TokenType.class',
                    '**/response/ApiResponse.class',
            ])
        }))
    }
}
check.dependsOn jacocoTestCoverageVerification
