# 로컬 개발 프로파일. 비밀값은 담지 않는다 — 실제 시크릿은 application-secret.yml(커밋 제외)에 둔다.
spring:
  # 커밋되지 않는 로컬 시크릿. 없어도 기동된다.
  config:
    import: optional:classpath:application-secret.yml
  jpa:
    hibernate:
      # 스키마는 Flyway가 만든다. 엔티티와 어긋나면 기동 시점에 잡아내도록 validate만 수행한다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3314}/${DB_NAME:user_db}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:kurly}
    password: ${DB_PASSWORD:kurly}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

kurly:
  security:
    # auth-service와 값이 한 글자라도 다르면 모든 토큰이 거부된다.
    issuer: ${JWT_ISSUER:https://auth.kurly.local}
    audience: ${JWT_AUDIENCE:kurly-api}
    # auth-service가 배포하는 공개키. user-service는 이 키로 직접 검증한다(설계서 3.4).
    jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
