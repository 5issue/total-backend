server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:3308}/${ORDER_DB_NAME:order_db}
    username: ${ORDER_DB_USERNAME:order}
    password: ${ORDER_DB_PASSWORD:order}
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}