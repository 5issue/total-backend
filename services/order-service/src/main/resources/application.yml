spring:
  application:
    name: order-service
  profiles:
    default: local
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8080/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

services:
  http:
    connect-timeout: ${SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${SERVICE_READ_TIMEOUT:5s}
  storage:
    refund-attachment-bucket: ${REFUND_ATTACHMENT_BUCKET:refund-attachments}
