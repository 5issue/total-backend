spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  ssl:
    bundle:
      pem:
        rabbitmq-ssl:
          truststore:
            certificate: ${RABBITMQ_SSL_CERT_PATH}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    ssl:
      enabled: true
      verify-hostname: true
      bundle: rabbitmq-ssl
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

services:
  oms:
    base-url: ${OMS_SERVICE_BASE_URL}
  payment:
    base-url: ${PAYMENT_SERVICE_BASE_URL}
  product:
    base-url: ${PRODUCT_SERVICE_BASE_URL}
  member:
    base-url: ${MEMBER_SERVICE_BASE_URL}
  ai:
    # 예: http://ai-service.kurly.svc.cluster.local — 정확한 서비스명은 인프라팀 확인 필요
    #
    # 다른 값과 달리 기본값을 비워 둔다. 주입되지 않아도 기동은 되게 하려는 것이다.
    # UnresolvedPlaceholderGuard는 미해결 플레이스홀더를 보면 컨텍스트 생성 전에 기동을
    # 중단시키는데, 냉장고 적재는 부가 기능이라 그것 때문에 주문 서비스 전체가 죽으면 안 된다.
    # 비어 있으면 기동 시 경고를 남기고 적재만 건너뛴다(배송 완료는 정상 처리된다).
    base-url: ${AI_BASE_URL:}

kurly:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    enabled: true
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    jwks-uri: ${JWT_JWKS_URI}
