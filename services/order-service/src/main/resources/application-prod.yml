spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  ssl:
    bundle:
      pem:
        rabbitmq-ssl:
          truststore:
            certificate: ${RABBITMQ_SSL_CERT_PATH}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    ssl:
      enabled: true
      verify-hostname: true
      bundle: rabbitmq-ssl
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

services:
  oms:
    base-url: ${OMS_SERVICE_BASE_URL}
  payment:
    base-url: ${PAYMENT_SERVICE_BASE_URL}
  product:
    base-url: ${PRODUCT_SERVICE_BASE_URL}
  member:
    base-url: ${MEMBER_SERVICE_BASE_URL}
  payment:
    base-url: ${PAYMENT_SERVICE_BASE_URL}
  product:
    base-url: ${PRODUCT_SERVICE_BASE_URL}
  member:
    base-url: ${MEMBER_SERVICE_BASE_URL}

kurly:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    enabled: true
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    jwks-uri: ${JWT_JWKS_URI}
