services:
  mysql:
    image: mysql:8.4
    container_name: kurly-order-mysql-local
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-order_db}
      MYSQL_USER: ${DB_USERNAME:-order}
      MYSQL_PASSWORD: ${DB_PASSWORD:-order}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    volumes:
      - order_mysql_local_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  order_mysql_local_data:
