services:
  mysql:
    image: mysql:8.4
    container_name: kurly-order-mysql-prod
    ports:
      - "${ORDER_DB_BIND_ADDRESS:-127.0.0.1}:${ORDER_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${ORDER_DB_NAME:-order_db}
      MYSQL_USER: ${ORDER_DB_USERNAME:-order}
      MYSQL_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${ORDER_DB_ROOT_PASSWORD:?ORDER_DB_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - order_mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

volumes:
  order_mysql_prod_data:
