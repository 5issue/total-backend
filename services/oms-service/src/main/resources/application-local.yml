spring:
  datasource:
    url: jdbc:postgresql://localhost:5438/oms
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

kurly:
  security:
    enabled: false

server:
  port: 8086
