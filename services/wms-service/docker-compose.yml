services:
  postgres-wms:
    image: postgres:16-alpine
    container_name: kurly-postgres-wms
    hostname: postgres-wms
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - wms_postgres_data:/var/lib/postgresql/data
    # db/seed/seed_wms_product.sql이 dblink로 product-service DB(host.docker.internal:5436)에
    # 접속한다. Docker Desktop(macOS/Windows)은 기본 지원하지만 Linux는 이 매핑이 있어야
    # host.docker.internal이 풀린다(루트 docker-compose.yml의 swagger-ui와 동일한 이유).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wms}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  wms_postgres_data:
    name: kurly-wms-postgres-data
