spring:
  application:
    name: wms-service
  profiles:
    default: local
  jpa:
    open-in-view: false
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

wms:
  outbox:
    # 입고 완료(wms.inbound.completed) 등 발행 이벤트. 큐/바인딩은 소비하는 서비스가 선언한다.
    exchange: wms.topic.exchange
    batch-size: 100
    publish-delay-ms: 5000
  order:
    # order-service가 발행하는 order.inventory.confirm 구독. 큐/바인딩은 소비자인 우리가 선언한다.
    exchange: order.topic.exchange
    confirm-routing-key: order.inventory.confirm
    confirm-queue: wms.inventory.confirm.queue
    dead-letter: wms.inventory.confirm.dlq
  outbound:
    # 출고 전표가 재고를 전혀 확보(OUT_OF_STOCK)하지 못한 채로 버틸 수 있는 최대 시간.
    allocation-timeout: 2h
    failure-check-interval-ms: 3600000

kurly:
  security:
    enabled: true