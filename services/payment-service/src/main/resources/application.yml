spring:
  application:
    name: payment-service
  profiles:
    # 프로파일을 지정하지 않으면 로컬로 동작한다. 운영은 --spring.profiles.active=prod
    default: local
  jpa:
    open-in-view: false
  jackson:
    deserialization:
      # 끄지 않으면 Jackson이 32000.9를 조용히 32000으로 잘라 Long에 넣는다.
      # 금액에서 이 절사는 곧 승인 금액과 요청 금액의 불일치다. 소수부가 오면 거부해야 한다.
      accept-float-as-int: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  task:
    scheduling:
      # 기본값은 1이다. 워커가 한 스레드를 나눠 쓰면 PG 대사가 외부 호출로 오래 머무는 동안
      # 아웃박스 발행(5초 주기)이 통째로 밀린다. 워커 수만큼 준다.
      pool:
        size: 5

payment:
  messaging:
    # 결제 이벤트를 내보낼 익스체인지. 큐와 바인딩은 소비하는 서비스가 선언한다.
    exchange: payment.topic.exchange
  outbox:
    # 이 횟수만큼 발행에 실패하면 FAILED로 멈춘다. 나가지 않는 이벤트가 배치 묶음을 계속
    # 차지하면 뒤에 쌓인 정상 이벤트가 밀린다. 멈춘 뒤로는 사람이 봐야 한다.
    max-attempts: 5
  cleanup:
    # 완료 기록 정리. 자주 돌 이유가 없어 하루 한 번.
    delay-ms: 86400000
    batch-size: 500
    # 보관 기간. 짧게 잡으면 멱등키가 사라진 뒤 온 재요청이 결제를 새로 실행한다.
    retention: P7D
  reconcile:
    # PG 대사 주기. 우리 기록과 PG가 어긋난 결제를 찾아 맞춘다.
    delay-ms: 300000
    batch-size: 100
    # 이 시간이 지나도록 결론이 안 난 결제만 대사한다(PG 승인 타임아웃보다 넉넉히 길게).
    stale-after: PT10M
    # 결과를 모른 채 REQUESTED로 남은 취소를 재시도 큐로 회수하기까지의 유예.
    cancel-stale-after: PT15M
  idempotency:
    # 매달린 IN_PROGRESS 선점 해제 주기. 결제 대사가 결론을 낸 뒤에 풀리도록 유예를 더 길게 둔다.
    delay-ms: 300000
    batch-size: 200
    stale-after: PT30M
  refund:
    # 반품 승인 환불 이벤트 구독(주문-결제 시퀀스 3절). 큐는 소비자인 우리가 선언한다.
    exchange: order.topic.exchange
    routing-key: order.refund.requested
    queue: payment.refund.queue
    # 처리할 수 없는 메시지가 무한 재배달되며 큐를 막지 않도록 보낼 곳.
    dead-letter: payment.refund.dlq

server:
  port: 8083

kurly:
  security:
    # 공통 인증 처리기. 모든 엔드포인트가 인가 애노테이션을 표기해야 기동된다.
    enabled: true
