spring:
  application:
    name: payment-service
  profiles:
    # 프로파일을 지정하지 않으면 로컬로 동작한다. 운영은 --spring.profiles.active=prod
    default: local
  jpa:
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8083

kurly:
  security:
    # 공통 인증 처리기. 모든 엔드포인트가 인가 애노테이션을 표기해야 기동된다.
    enabled: true
