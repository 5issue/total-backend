plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Spring Boot BOM이 관리하지 않는 의존성이라 버전을 직접 지정한다.
    implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'

    // 관리자 비밀번호 해시(BCrypt)만 사용한다. starter-security를 넣으면 기본 필터체인이
    // 모든 요청을 차단해 별도 설정이 필요하므로 crypto 모듈만 의존한다.
    implementation 'org.springframework.security:spring-security-crypto'

    // JWT 서명키를 KMS에 두기 위한 SDK(인증인가_설계서 1.3.2 — 개인키 외부 반출 금지).
    // Spring Boot BOM이 관리하지 않아 버전을 직접 지정한다.
    //
    // 기본 의존성에는 비동기용 Netty 클라이언트가 딸려온다. 서명은 토큰 발급 시점에만 일어나는
    // 저빈도 동기 호출이라 Netty가 필요 없고, 쓰지도 않는 네트워크 스택을 서비스에 들이면
    // 취약점 관리 대상만 늘어난다. JDK 기본 커넥션을 쓰는 경량 클라이언트로 대체한다.
    // (의존성 44개·Netty 10개 → 29개·Netty 0개)
    implementation('software.amazon.awssdk:kms:2.35.0') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client:2.35.0'

    // 스키마 형상 관리. ddl-auto:update는 CHECK 제약 등을 갱신하지 않아 운영에 쓸 수 없다.
    // Spring Boot 4에서 Flyway 자동설정이 spring-boot-autoconfigure에서 분리되어
    // spring-boot-flyway 모듈을 별도로 의존해야 한다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // Spring Boot 4에서 MockMvc 자동설정(@AutoConfigureMockMvc)이 별도 모듈로 분리되어
    // spring-boot-starter-test에 포함되지 않는다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

// 팀 컨벤션: Jacoco 라인 80% / 브랜치 80% 이상
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
    // 측정 대상에서 제외: 값 객체(record)·설정·상수처럼 로직이 없는 것과
    // 실행 진입점, 그리고 외부 자격증명이 있어야 검증 가능한 CLI.
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/AuthServiceApplication.class',
                    '**/infrastructure/config/**',
                    '**/presentation/dto/**',
                    '**/application/dto/**',
                    '**/domain/enums/**',
                    '**/exception/AuthErrorCode.class',
            ])
        }))
    }
}
check.dependsOn jacocoTestCoverageVerification
