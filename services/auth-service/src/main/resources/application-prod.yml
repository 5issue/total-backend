# 운영 프로파일.
#
# 민감값에는 기본값을 두지 않는다. Boot의 Binder는 해석하지 못한 플레이스홀더를 예외로 만들지 않고
# 리터럴 문자열로 남기므로, 기동 중단은 common의 UnresolvedPlaceholderGuard가 담당한다.
# (환경변수가 하나라도 빠지면 컨텍스트 생성 전에 누락 목록을 모두 모아 보고하고 중단한다.)
spring:
  jpa:
    hibernate:
      # 운영에서 스키마를 애플리케이션이 바꾸는 일은 없어야 하므로 환경변수로도 못 바꾸게 고정한다.
      ddl-auto: validate
  flyway:
    enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

jwt:
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  # 반드시 주입해야 한다. 비어 있으면 기동 시 임시 키가 생성되는데, 운영에서는
  # 파드마다 서로 다른 키로 서명하게 되어 JWKS를 받아간 서비스가 검증에 실패한다.
  # 기본값을 두지 않아 누락 시 기동이 중단되도록 한다.
  private-jwk: ${JWT_PRIVATE_JWK}

auth:
  refresh-cookie:
    # 운영은 예외 없이 true.
    secure: true

kurly:
  security:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}

user-service:
  base-url: ${USER_SERVICE_BASE_URL}

oauth:
  allowed-redirect-uris:
    - ${OAUTH_REDIRECT_URI_KAKAO}
    - ${OAUTH_REDIRECT_URI_NAVER}
  providers:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
    naver:
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
