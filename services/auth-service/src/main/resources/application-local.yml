# 로컬 개발 프로파일. 비밀값은 담지 않는다 — 실제 시크릿은 application-secret.yml(커밋 제외)에 둔다.
spring:
  # 커밋되지 않는 로컬 시크릿. 없어도 기동된다.
  config:
    import: optional:classpath:application-secret.yml
  jpa:
    hibernate:
      # 스키마는 Flyway가 만든다. 엔티티와 어긋나면 기동 시점에 잡아내도록 validate만 수행한다.
      # 로컬에서 스키마를 새로 만들 때만 create로 덮어쓴다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:auth_db}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:kurly}
    password: ${DB_PASSWORD:kurly}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  # 로컬은 AWS 없이 기동한다. 프로세스가 임시 키를 만들어 서명한다.
  key-provider: local
  issuer: ${JWT_ISSUER:https://auth.kurly.local}
  audience: ${JWT_AUDIENCE:kurly-api}
  # 비우면 기동 시 임시 키를 생성한다. 로컬에서만 허용되는 동작이다.
  private-jwk: ${JWT_PRIVATE_JWK:}

auth:
  refresh-cookie:
    # 로컬은 http로 테스트하므로 Secure를 내린다. 운영은 항상 true.
    secure: ${AUTH_REFRESH_COOKIE_SECURE:false}

kurly:
  cors:
    # 로컬 프론트 오리진. 공통 기본값은 :8080이라 주입하지 않으면 :3000에서 오는
    # 브라우저 호출이 프리플라이트에서 전부 막힌다(frontend-redirect-uri와 맞춘다).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    issuer: ${JWT_ISSUER:https://auth.kurly.local}
    audience: ${JWT_AUDIENCE:kurly-api}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8088}

oauth:
  # 인가 코드 가로채기를 막기 위한 화이트리스트(BE-01). 콘솔 등록값과 정확히 일치해야 한다.
  # 백엔드 콜백(제공자 → 백엔드)과 프론트 콜백(제공자 → 프론트 서버)을 모두 허용해 둔다.
  allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:http://localhost:8081/api/v1/auth/oauth/kakao/callback,http://localhost:8081/api/v1/auth/oauth/naver/callback,http://localhost:3000/callback/kakao,http://localhost:3000/callback/naver}
  # 콜백 처리 후 브라우저를 돌려보낼 프론트 주소. 요청값이 아니라 설정값만 쓴다(오픈 리다이렉트 방지).
  frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:3000/}
  providers:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
