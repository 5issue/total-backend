spring:
  application:
    name: auth-service
  profiles:
    # 프로파일을 지정하지 않으면 로컬로 동작한다. 운영은 --spring.profiles.active=prod
    default: local
  jpa:
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8081

jwt:
  # 인증인가_설계서 1.3 — access 30분 / refresh 14일
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}

auth:
  # 인증인가_설계서 1.4 — refresh token은 HttpOnly + Secure + SameSite 쿠키로만 오간다.
  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:refresh_token}
    # API 명세 기준. 재발급 엔드포인트에만 쿠키가 실린다.
    path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth/refresh}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Strict}

kurly:
  security:
    # 공통 인증 처리기. 모든 엔드포인트가 인가 애노테이션을 표기해야 기동된다.
    enabled: true
    # auth-service는 서명키를 직접 보유하므로 jwks-uri가 필요 없다(LocalJwkSourceConfig).

oauth:
  # 엔드포인트·식별자 경로는 비밀이 아니므로 프로파일 공통이다.
  providers:
    kakao:
      authorize-uri: ${KAKAO_AUTHORIZE_URI:https://kauth.kakao.com/oauth/authorize}
      token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
      # 사용자 정보 응답의 최상위 "id"(회원번호, Long)
      user-id-path: ${KAKAO_USER_ID_PATH:id}
      # REST API도 PKCE를 지원한다(카카오 데브톡 공식 답변).
      pkce-enabled: ${KAKAO_PKCE_ENABLED:true}
      token-request-method: POST
    naver:
      # OIDC 경로(/oauth2/)다. 구 OAuth2.0 경로(/oauth2.0/)에는 PKCE가 없다(개발가이드 3.5.1).
      authorize-uri: ${NAVER_AUTHORIZE_URI:https://nid.naver.com/oauth2/authorize}
      token-uri: ${NAVER_TOKEN_URI:https://nid.naver.com/oauth2/token}
      user-info-uri: ${NAVER_USER_INFO_URI:https://openapi.naver.com/v1/nid/me}
      user-id-path: ${NAVER_USER_ID_PATH:response.id}
      # OIDC 인증 요청은 scope=openid가 필수다(3.5.4).
      scope: ${NAVER_SCOPE:openid}
      pkce-enabled: ${NAVER_PKCE_ENABLED:true}
      # OIDC 토큰 발급은 POST다(3.5.6).
      token-request-method: ${NAVER_TOKEN_REQUEST_METHOD:POST}
