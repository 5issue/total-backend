name: CD - order-service

on:
  push:
    branches: [develop]
    paths:
      - 'services/order-service/**'
      - 'common/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ARM64 빌드 지원용 에뮬레이터
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 멀티 아키텍처 빌드 도구 활성화
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # amd64 + arm64 둘 다 빌드해서 push
      - name: 이미지 빌드·push (멀티 아키텍처)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/order-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/kurly-order:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/kurly-order:latest
