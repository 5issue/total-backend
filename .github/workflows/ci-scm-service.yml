name: CI - scm-service

on:
  push:
    branches: [develop]
    paths:
      - 'services/scm-service/**'
      # common이 바뀌면 이 서비스도 깨질 수 있다. 공통 모듈과 빌드 스크립트를 함께 감시한다.
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/ci-scm-service.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'services/scm-service/**'
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/ci-scm-service.yml'
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 진행 중이던 실행은 취소한다. 어차피 결과를 쓰지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Gradle 설정
        # 의존성·빌드 캐시를 알아서 복원하고 저장한다.
        uses: gradle/actions/setup-gradle@v4

      # common을 함께 빌드한다. :scm-service:build는 common의 jar만 필요로 해서
      # common의 테스트를 돌리지 않는다. 공통 모듈이 깨진 채로 통과하면 안 된다.
      #
      # scm-service는 아직 골격만 있어 테스트가 없다. 구현이 붙으면 그대로 검사된다.
      - name: 빌드·테스트
        run: ./gradlew :common:build :scm-service:build

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-scm-service
          path: |
            common/build/reports/tests/
            services/scm-service/build/reports/tests/
          retention-days: 7
