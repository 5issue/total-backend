name: CI - oms-service

on:
  push:
    branches: [ develop ]
    paths:
      - 'services/oms-service/**'
  pull_request:
    branches: [ develop ]
    paths:
      - 'services/oms-service/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: oms_db
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: oms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oms -d oms_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4
        env:
          RABBITMQ_DEFAULT_USER: oms-service
          RABBITMQ_DEFAULT_PASS: oms1234
          RABBITMQ_DEFAULT_VHOST: msa
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            services
            common
            build.gradle
            settings.gradle
            gradlew
            gradle

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/oms_db
          SPRING_DATASOURCE_USERNAME: oms
          SPRING_DATASOURCE_PASSWORD: oms
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: oms-service
          SPRING_RABBITMQ_PASSWORD: oms1234
          SPRING_RABBITMQ_VIRTUAL_HOST: msa
        run: ./gradlew :oms-service:clean :oms-service:build :oms-service:jacocoTestReport --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oms-service
          path: services/oms-service/build/libs/*[!plain].jar

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-oms-report
          path: services/oms-service/build/reports/jacoco/test/html/
