name: PR Discord Notification

on:
  workflow_run:
    workflows:
      - "CI - auth-service"
      - "CI - oms-service"
      - "CI - order-service"
      - "CI - payment-service"
      - "CI - product-service"
      - "CI - scm-service"
      - "CI - wms-service"
    types:
      - completed

permissions:
  pull-requests: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Send Discord Notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ vars.DISCORD_USER_MAP }}
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const conclusion = workflowRun.conclusion;
            const workflowName = workflowRun.name;

            // PR 정보 가져오기
            const prs = workflowRun.pull_requests;
            if (!prs || prs.length === 0) {
              console.log('No PR associated with this workflow run');
              return;
            }

            const prNumber = prs[0].number;

            // 해당 PR에 아직 진행 중인 CI가 있는지 확인
            const checkRuns = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: workflowRun.head_sha,
              filter: 'latest'
            });

            const pendingCI = checkRuns.data.check_runs.filter(cr =>
              cr.name !== 'notify' &&
              cr.name !== 'CodeRabbit' &&
              (cr.status === 'queued' || cr.status === 'in_progress')
            );

            if (pendingCI.length > 0) {
              console.log(`Still ${pendingCI.length} CI(s) running. Skipping notification.`);
              return;
            }

            const prData = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const pr = prData.data;

            // Discord 유저 매핑
            const mapStr = process.env.DISCORD_USER_MAP || '';
            const userMap = {};
            mapStr.split(',').forEach(pair => {
              const [gh, dc] = pair.split(':');
              if (gh && dc) userMap[gh.trim()] = dc.trim();
            });

            const authorMention = userMap[pr.user.login]
              ? `<@${userMap[pr.user.login]}>`
              : pr.user.login;

            const reviewers = pr.requested_reviewers.map(r =>
              userMap[r.login] ? `<@${userMap[r.login]}>` : r.login
            ).join(', ') || '미배정';

            let message;
            if (conclusion === 'success') {
              message = `✅ **${workflowName} 성공! 리뷰 부탁드립니다.**\n📌 PR: ${pr.title}\n🔗 <${pr.html_url}>\n👤 작성자: ${authorMention}\n👁️ 리뷰어: ${reviewers}`;
            } else {
            message = `❌ **${workflowName} 실패!**\n📌 PR: ${pr.title}\n🔗 <${pr.html_url}>\n👤 작성자: ${authorMention}\n⚠️ CI 실패했습니다. 확인해주세요.`;
            }

            await fetch(process.env.DISCORD_WEBHOOK, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: message })
            });