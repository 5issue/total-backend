name: PR CI and Discord Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build

  notify-success:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Get Reviewers and Send Discord Notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ vars.DISCORD_USER_MAP }}
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            // Discord 유저 매핑
            const mapStr = process.env.DISCORD_USER_MAP || '';
            const userMap = {};
            mapStr.split(',').forEach(pair => {
              const [gh, dc] = pair.split(':');
              if (gh && dc) userMap[gh.trim()] = dc.trim();
            });

            const authorGh = context.payload.pull_request.user.login;
            const authorMention = userMap[authorGh] ? `<@${userMap[authorGh]}>` : authorGh;

            const reviewers = pr.data.requested_reviewers.map(r => {
              return userMap[r.login] ? `<@${userMap[r.login]}>` : r.login;
            }).join(', ') || '미배정';

            const body = JSON.stringify({
              content: `✅ **CI 성공! 리뷰 부탁해요!**\n📌 PR: ${context.payload.pull_request.title}\n🔗 ${context.payload.pull_request.html_url}\n👤 작성자: ${authorMention}\n👁️ 리뷰어: ${reviewers}`
            });

            await fetch(process.env.DISCORD_WEBHOOK, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: body
            });

  notify-failure:
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    steps:
      - name: Send Discord Failure Notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ vars.DISCORD_USER_MAP }}
        with:
          script: |
            const mapStr = process.env.DISCORD_USER_MAP || '';
            const userMap = {};
            mapStr.split(',').forEach(pair => {
              const [gh, dc] = pair.split(':');
              if (gh && dc) userMap[gh.trim()] = dc.trim();
            });

            const authorGh = context.payload.pull_request.user.login;
            const authorMention = userMap[authorGh] ? `<@${userMap[authorGh]}>` : authorGh;

            const body = JSON.stringify({
              content: `❌ **CI 실패!**\n📌 PR: ${context.payload.pull_request.title}\n🔗 ${context.payload.pull_request.html_url}\n👤 작성자: ${authorMention}\n 확인해주세요!`
            });

            await fetch(process.env.DISCORD_WEBHOOK, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: body
            });