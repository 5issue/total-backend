language: "ko"
reviews:
  instructions: |
    이 프로젝트는 다음 기술스택을 사용합니다:
    - Spring Boot 4.1.0
    - Gradle 9.1.0
    - Java 25
    - MySQL, PostgreSQL (서비스별로 다른 DB 사용)

    리뷰 지침:
    1. 오버엔지니어링 방지: 현재 요구사항에 비해 과도하게 추상화하거나, 불필요한 디자인 패턴을 적용하고 있지 않은지 확인해주세요.
    2. 중복 코드 검출: 동일하거나 유사한 로직이 여러 곳에 반복되고 있다면 지적해주세요.
    3. 과한 코딩 방지: 단순하게 해결할 수 있는 문제를 복잡하게 풀고 있지 않은지 확인해주세요. KISS 원칙을 기준으로 판단해주세요.
    4. Spring Boot 4.1.0 및 Gradle 9.1.0 호환성에 맞지 않는 코드가 있으면 지적해주세요.
    5. 불필요한 의존성 추가가 있으면 지적해주세요.